<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B57"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1060" fill="#FAFAFC"/>

  <!-- ── title ───────────────────────────────────────────────────────────── -->
  <text x="80" y="62" font-size="34" font-weight="700" fill="#14161A">Blender Finisher</text>
  <text x="80" y="94" font-size="18" fill="#6B7280">rough mesh → measured game-ready asset &#160;·&#160; an MCP server with a ruler</text>

  <!-- ── MCP client ──────────────────────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="600" y="126" width="400" height="60" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  </g>
  <text x="800" y="163" font-size="18" font-weight="600" fill="#14161A" text-anchor="middle">MCP client &#160;·&#160; Claude / any LLM</text>

  <path d="M 800 186 L 800 212 L 400 212 L 400 250" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="204" font-size="14" fill="#6B7280" text-anchor="middle">MCP stdio JSON-RPC</text>

  <!-- ── SERVER PROCESS ──────────────────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="80" y="250" width="640" height="470" rx="16" fill="#EAF0FC" stroke="#3B6FD4" stroke-width="2"/>
  </g>
  <text x="108" y="288" font-size="15" font-weight="700" fill="#3B6FD4" letter-spacing="1.2">SERVER PROCESS</text>
  <text x="108" y="312" font-size="13" fill="#4B5563">Apache-2.0 &#160;·&#160; standalone &#160;·&#160; never imports bpy</text>

  <!-- policy -->
  <rect x="112" y="334" width="576" height="164" rx="12" fill="#F2EAFC" stroke="#7C4DBE" stroke-width="1.8"/>
  <circle cx="146" cy="368" r="15" fill="#7C4DBE"/>
  <text x="146" y="374" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="172" y="374" font-size="19" font-weight="700" fill="#5B3A91">FINISHING &#8212; policy</text>
  <text x="132" y="408" font-size="15" fill="#374151">asset classes &#183; triangle budgets &#183; readiness gates</text>
  <text x="132" y="434" font-size="15" fill="#374151">skills: <tspan font-weight="600">bake_and_finish</tspan> (reduce → bake → LOD/collision)</text>
  <text x="132" y="460" font-size="15" fill="#374151">objective benchmark &#183; engine import check</text>
  <text x="132" y="484" font-size="13" fill="#6B7280" font-style="italic">“is this a shippable game asset?”</text>

  <!-- tools -->
  <rect x="112" y="518" width="576" height="164" rx="12" fill="#FFFFFF" stroke="#3B6FD4" stroke-width="1.8"/>
  <circle cx="146" cy="552" r="15" fill="#3B6FD4"/>
  <text x="146" y="558" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="172" y="558" font-size="19" font-weight="700" fill="#2C55A6">TOOL SURFACE</text>
  <text x="132" y="592" font-size="15" fill="#374151"><tspan font-weight="600">~305 ToolSpecs</tspan> across 48 domains</text>
  <text x="132" y="618" font-size="15" fill="#374151">schema-validated &#183; parity-enforced vs the add-on</text>
  <text x="132" y="644" font-size="15" fill="#374151">mesh &#183; object &#183; uv &#183; shading &#183; modifiers &#183; io &#8230;</text>
  <text x="132" y="668" font-size="13" fill="#6B7280" font-style="italic">“how do I drive Blender safely?” &#8212; frozen library</text>

  <path d="M 400 498 L 400 518" stroke="#7C4DBE" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ── boundary ────────────────────────────────────────────────────────── -->
  <line x1="800" y1="250" x2="800" y2="720" stroke="#9AA3AF" stroke-width="2" stroke-dasharray="8 7"/>
  <g transform="translate(800,485) rotate(-90)">
    <rect x="-150" y="-30" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.5"/>
    <text x="0" y="-6" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">localhost socket &#183; newline JSON</text>
    <text x="0" y="16" font-size="13" fill="#6B7280" text-anchor="middle">process boundary = license boundary</text>
  </g>

  <path d="M 688 600 L 770 600" stroke="#4B5563" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 830 600 L 912 600" stroke="#4B5563" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ── BLENDER PROCESS ─────────────────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="880" y="250" width="640" height="470" rx="16" fill="#FDF3E3" stroke="#C77A18" stroke-width="2"/>
  </g>
  <text x="908" y="288" font-size="15" font-weight="700" fill="#B06A12" letter-spacing="1.2">BLENDER PROCESS &#160;·&#160; visible GUI</text>
  <text x="908" y="312" font-size="13" fill="#4B5563">GPL-3.0 add-on &#160;·&#160; imports bpy &#160;·&#160; derivative of Blender</text>

  <!-- perception -->
  <rect x="912" y="334" width="576" height="164" rx="12" fill="#E7F5EC" stroke="#2E8B57" stroke-width="1.8"/>
  <circle cx="946" cy="368" r="15" fill="#2E8B57"/>
  <text x="946" y="374" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="972" y="374" font-size="19" font-weight="700" fill="#206B41">PERCEPTION &#8212; the ruler</text>
  <text x="932" y="408" font-size="15" fill="#374151">silhouette IoU &#183; surface-fidelity <tspan font-weight="600">SSIM</tspan> &#183; topology</text>
  <text x="932" y="434" font-size="15" fill="#374151">multi-angle capture &#183; readiness gate fractions</text>
  <text x="932" y="460" font-size="15" fill="#374151">deterministic &#183; judge-free &#183; fail-closed</text>
  <text x="932" y="484" font-size="13" fill="#206B41" font-style="italic" font-weight="600">no LLM grades its own homework</text>

  <!-- bridge -->
  <rect x="912" y="518" width="576" height="164" rx="12" fill="#FFFFFF" stroke="#C77A18" stroke-width="1.8"/>
  <circle cx="946" cy="552" r="15" fill="#C77A18"/>
  <text x="946" y="558" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="972" y="558" font-size="19" font-weight="700" fill="#A05F0E">BRIDGE &#8212; niua_mcp_bridge</text>
  <text x="932" y="592" font-size="15" fill="#374151">main-thread queue (bpy is not thread-safe)</text>
  <text x="932" y="618" font-size="15" fill="#374151">command registry &#183; structured errors &#183; checkpoints</text>
  <text x="932" y="644" font-size="15" fill="#374151"><tspan font-weight="600">system.execute_python</tspan> &#8212; off by default</text>
  <text x="932" y="668" font-size="13" fill="#6B7280" font-style="italic">executes every call inside Blender</text>

  <path d="M 1200 518 L 1200 498" stroke="#2E8B57" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- supervisor -->
  <rect x="1230" y="196" width="290" height="44" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="1375" y="224" font-size="14" fill="#4B5563" text-anchor="middle">supervisor &#183; relaunches on crash</text>
  <path d="M 1375 240 L 1375 250" stroke="#9AA3AF" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>

  <!-- ── the loop ────────────────────────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="80" y="772" width="1440" height="216" rx="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  </g>
  <text x="112" y="810" font-size="16" font-weight="700" fill="#14161A" letter-spacing="0.6">THE LOOP &#8212; what makes it a product, not an API</text>

  <rect x="120" y="836" width="230" height="72" rx="10" fill="#FFFFFF" stroke="#3B6FD4" stroke-width="2"/>
  <text x="235" y="870" font-size="18" font-weight="700" fill="#2C55A6" text-anchor="middle">act</text>
  <text x="235" y="893" font-size="13" fill="#6B7280" text-anchor="middle">run a finishing move</text>

  <rect x="410" y="836" width="230" height="72" rx="10" fill="#E7F5EC" stroke="#2E8B57" stroke-width="2"/>
  <text x="525" y="870" font-size="18" font-weight="700" fill="#206B41" text-anchor="middle">measure</text>
  <text x="525" y="893" font-size="13" fill="#6B7280" text-anchor="middle">SSIM · IoU · budget</text>

  <rect x="700" y="836" width="230" height="72" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
  <text x="815" y="870" font-size="18" font-weight="700" fill="#14161A" text-anchor="middle">judge</text>
  <text x="815" y="893" font-size="13" fill="#6B7280" text-anchor="middle">gates, order-free</text>

  <rect x="990" y="808" width="230" height="62" rx="10" fill="#E7F5EC" stroke="#2E8B57" stroke-width="2"/>
  <text x="1105" y="836" font-size="17" font-weight="700" fill="#206B41" text-anchor="middle">keep</text>
  <text x="1105" y="857" font-size="13" fill="#6B7280" text-anchor="middle">proven better</text>

  <rect x="990" y="890" width="230" height="62" rx="10" fill="#FCEAE8" stroke="#C0392B" stroke-width="2"/>
  <text x="1105" y="918" font-size="17" font-weight="700" fill="#A5302A" text-anchor="middle">revert</text>
  <text x="1105" y="939" font-size="13" fill="#6B7280" text-anchor="middle">failed OR unmeasured</text>

  <path d="M 350 872 L 402 872" stroke="#4B5563" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 640 872 L 692 872" stroke="#4B5563" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 930 866 L 960 866 L 960 839 L 982 839" stroke="#2E8B57" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 930 878 L 960 878 L 960 921 L 982 921" stroke="#C0392B" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>

  <path d="M 1220 839 L 1300 839 L 1300 962 L 235 962 L 235 910" stroke="#9AA3AF" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1220 921 L 1300 921" stroke="#9AA3AF" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <text x="770" y="982" font-size="13" fill="#6B7280" text-anchor="middle">next move</text>

  <text x="1340" y="878" font-size="14" font-weight="700" fill="#A5302A">unmeasured</text>
  <text x="1340" y="898" font-size="14" font-weight="700" fill="#A5302A">≠ passed</text>

  <!-- footer -->
  <text x="80" y="1026" font-size="13" fill="#9AA3AF">Two test-enforced invariants: interface never imports finishing · the server never imports bpy (which is also what keeps the licenses separable)</text>
</svg>
