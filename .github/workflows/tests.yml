name: tests

# The invariants this repo relies on (no bpy in the server, interface never imports
# finishing, server/add-on command parity) are only real if something runs them.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; test it so the claim stays true.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # Blender is absent on the runner: the suite is offline by design and the
      # Blender-dependent smoke test skips itself.
      - name: Test
        run: python -m pytest

  invariants:
    # Called out separately so a break here is unmistakable in the checks list:
    # the bpy guard is what keeps the Apache server separable from the GPL add-on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Architecture and licensing invariants
        run: |
          python -m pytest -v \
            tests/test_no_bpy_in_server.py \
            tests/test_layer_boundary.py \
            tests/test_evals_is_not_the_product.py \
            tests/test_no_vendor_brand_in_user_data.py \
            tests/test_parity.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel
      - name: Wheel must contain the product only
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          # The GPL add-on is a separate work and must never ride along (LICENSING.md).
          addon = [n for n in names if "niua_mcp_bridge" in n]
          # The benchmark harness is not the product, and its fixtures are untracked --
          # shipping it would ship something that can only fail (ARCHITECTURE.md).
          harness = [n for n in names if "/evals/" in n or n.endswith("/evals")]
          print(f"{wheel}: {len(names)} entries, {len(addon)} add-on, {len(harness)} harness")
          if addon:
              sys.exit(f"GPL add-on leaked into the Apache wheel: {addon[:5]}")
          if harness:
              sys.exit(f"benchmark harness leaked into the wheel: {harness[:5]}")
          PY
