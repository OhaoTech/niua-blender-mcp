[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "niua-blender-mcp"
version = "0.1.0"
description = "Agentic Blender MCP server and Blender add-on bridge"
requires-python = ">=3.11"
readme = "README.md"
# The packaged distribution is the MCP SERVER (src/), which never imports bpy and is
# Apache-2.0. The Blender add-on under blender_addon/ is GPL-3.0-or-later and is NOT
# part of this wheel -- it is installed into Blender separately. See LICENSING.md.
license = "Apache-2.0"
authors = [{ name = "FrankYin" }]
dependencies = []

[project.scripts]
niua-blender-mcp = "niua_blender_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"niua_blender_mcp.manifest" = ["*.json"]
"niua_blender_mcp.evals.battery.modeling_prop" = ["*.json", "*.md"]
"niua_blender_mcp.playbooks" = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "blender_addon"]
testpaths = ["tests"]
addopts = "-q"
