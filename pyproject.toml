[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "niua-blender-mcp"
version = "0.1.0"
description = "Agentic Blender MCP server and Blender add-on bridge"
requires-python = ">=3.11"
readme = "README.md"
# The packaged distribution is the MCP SERVER (src/), which never imports bpy and is
# Apache-2.0. The Blender add-on under blender_addon/ is GPL-3.0-or-later and is NOT
# part of this wheel -- it is installed into Blender separately. See LICENSING.md.
license = "Apache-2.0"
authors = [{ name = "FrankYin" }]
# RUNTIME dependencies are intentionally empty: a dependency-free server is part of
# the "separate program" argument in LICENSING.md. Test-only deps live in the extra
# below and are never installed for users.
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pillow>=10",   # image comparison in the silhouette/preservation metric tests
]

[project.scripts]
niua-blender-mcp = "niua_blender_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
# `evals` is the BENCHMARK HARNESS, not the product -- see ARCHITECTURE.md "What is and
# isn't the MCP". It is a leaf (nothing in the server imports it; only tests/ and
# scripts/ do) and its fixtures are large local .glb files that are deliberately not in
# the repo, so shipping the modules put a harness in users' wheels that could never load
# an item. Developers still get it: pytest puts `src` on the path directly.
exclude = ["niua_blender_mcp.evals", "niua_blender_mcp.evals.*"]

[tool.setuptools.package-data]
"niua_blender_mcp.manifest" = ["*.json"]
"niua_blender_mcp.playbooks" = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "blender_addon"]
testpaths = ["tests"]
addopts = "-q"
