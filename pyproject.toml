[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "niua-blender-mcp"
version = "0.2.1"
description = "Niua Blender Finisher — agentic MCP server + Blender extension"
requires-python = ">=3.11"
readme = "README.md"
# The packaged distribution is the MCP SERVER (src/), which never imports bpy and is
# Apache-2.0. The Blender add-on under blender_addon/ is GPL-3.0-or-later and is NOT
# part of this wheel -- it is installed into Blender separately. See LICENSING.md.
license = "Apache-2.0"
authors = [{ name = "FrankYin" }]
# RUNTIME dependencies are intentionally empty: a dependency-free server is part of
# the "separate program" argument in LICENSING.md. Test-only deps live in the extra
# below and are never installed for users.
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pillow>=10",   # image comparison in the silhouette/preservation metric tests
]

[project.scripts]
niua-blender-mcp = "niua_blender_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
# What ships is the MCP: neutral Blender translation plus the measurement eyes. Three
# things stay in the repo and out of the wheel -- see ARCHITECTURE.md "What is and isn't
# the MCP". Developers still get all of it: pytest puts `src` on the path directly.
#
#   evals            the BENCHMARK HARNESS. A leaf (nothing in the server imports it),
#                    and its fixtures are large .glb files deliberately not in the repo,
#                    so a shipped harness could only ever fail to load an item.
#   finishing        budgets, gates, asset classes, the finisher skills.
#   domains.policy   the tools those opinions drive: feedback.quality/readiness/critique/
#                    preservation/capture_intake, io.profile_validate, asset_class.*, and
#                    the object.retopo/lod_create/collision_* recipes. They are not good
#                    enough to ship -- retopo cannot take a dense character to budget --
#                    and a tool that fails on the hard case reads as a broken MCP.
exclude = [
  "niua_blender_mcp.evals", "niua_blender_mcp.evals.*",
  "niua_blender_mcp.finishing", "niua_blender_mcp.finishing.*",
  "niua_blender_mcp.domains.policy", "niua_blender_mcp.domains.policy.*",
]

[tool.setuptools.package-data]
"niua_blender_mcp.manifest" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "blender_addon"]
testpaths = ["tests"]
addopts = "-q"
